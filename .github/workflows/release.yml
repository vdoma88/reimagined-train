name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Determine release tag
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="v$DISPATCH_VERSION"
          else
            VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
            test -n "$VERSION"
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANIMATE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANIMATE_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        env:
          ANIMATE_KEYSTORE_PASSWORD: ${{ secrets.ANIMATE_KEYSTORE_PASSWORD }}
          ANIMATE_KEY_ALIAS: ${{ secrets.ANIMATE_KEY_ALIAS }}
          ANIMATE_KEY_PASSWORD: ${{ secrets.ANIMATE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "AniMate-$TAG.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AniMate ${{ env.TAG }}
          generate_release_notes: true
          body: |
            Установка: скачайте `AniMate-${{ env.TAG }}.apk` на Android 8+ и разрешите установку из этого источника.
            Для ответов персонажей нужен бесплатный ключ Google Gemini: https://aistudio.google.com/apikey (Настройки → Мозг персонажей).
          files: AniMate-${{ env.TAG }}.apk
